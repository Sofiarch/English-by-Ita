<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6FA" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>English by Ita</title>
    <script>
      // Apply saved theme + language before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem("ita-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
          var l = localStorage.getItem("ita-lang");
          if (l === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=Rubik:wght@300..800&family=Unbounded:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
